    <script>
      window.__oicDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__oicDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('oic-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__oicDeferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('oic-pwa-installed'));
      });
    </script>
